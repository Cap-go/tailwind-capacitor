name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify:registry-refs
      - run: npm run lint
      - run: npm run generate:css
      - run: npm run smoke:tailwind
      - run: npm run build:registry
      - run: git diff --exit-code public/r registry.json registry-vue.json registry-react.json registry-angular.json
      - run: npm run verify:registry-refs
      - run: npm test
      - run: npm run test:registry-install:vue
      - run: npm run test:registry-install:react
      - run: npm run test:registry-install:angular
      - run: npm run test:angular-full
      - run: npm run test:react-full
      - run: npm run test:vue-full
      - run: npm run test:readme-install
      - run: npm run sync:example
      - run: npm --prefix example ci
      - run: npm --prefix example run build
      - run: npm run build:example-react
